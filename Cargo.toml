[workspace]
members = ["crates/preemp_switch","firmware", "xtask"]
# A plain `cargo build`/`cargo test` at the root only touches the host-side
# xtask; the firmware is always built with an explicit --target.
default-members = ["xtask"]
resolver = "3"

[profile.release]
opt-level = "s"
lto = true
debug = true
